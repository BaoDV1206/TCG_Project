server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # cho phép upload ảnh (backend giới hạn 5MB/ảnh, 25MB/lần gửi)
    client_max_body_size 25m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # API và ảnh người dùng upload -> backend
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 60s;
    }
    location /uploads/ {
        proxy_pass http://backend:8080;
        expires 30d;
    }

    # file build của Vite có hash trong tên -> cache lâu dài
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location /demo-images/ {
        expires 7d;
        try_files $uri =404;
    }

    # React Router: mọi đường dẫn khác trả về index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
