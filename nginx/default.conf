# Cloudflare gửi kèm X-Forwarded-Proto: https; truy cập trực tiếp (không qua Cloudflare) thì dùng scheme thật
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name _;

    # cho phép upload ảnh (backend giới hạn 5MB/ảnh, 25MB/lần gửi)
    client_max_body_size 25m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;
    gzip_min_length 1024;

    # header gửi tiếp để backend / Next biết địa chỉ thật mà khách đang dùng (cần cho đăng nhập Google)
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Port "";
    proxy_set_header X-Forwarded-Prefix "";
    proxy_http_version 1.1;

    # ---------- Backend Spring Boot ----------
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_read_timeout 60s;
    }
    location /uploads/ {
        proxy_pass http://backend:8080;
        expires 30d;
    }
    # Đăng nhập Google (OAuth 2.0): chuyển sang Google và nhận kết quả trả về
    location /oauth2/ {
        proxy_pass http://backend:8080;
        add_header Cache-Control "no-store";
    }
    location /login/oauth2/ {
        proxy_pass http://backend:8080;
        add_header Cache-Control "no-store";
    }

    # ---------- Next.js (giao diện, ảnh đã tối ưu, sitemap, robots) ----------
    location / {
        proxy_pass http://next:3000;
        proxy_read_timeout 60s;
    }
}
