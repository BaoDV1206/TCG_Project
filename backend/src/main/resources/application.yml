server:
  port: 8080

spring:
  application:
    name: tcg-shop
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/tcgshopdb}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_batch_fetch_size: 50
        jdbc:
          time_zone: Asia/Ho_Chi_Minh
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 25MB

app:
  jwt:
    secret: ${JWT_SECRET:tcg-shop-dev-secret-key-please-change-in-production-0123456789}
    expiration-hours: 168
  upload-dir: ${UPLOAD_DIR:uploads}
  cors-origins: ${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:admin}
